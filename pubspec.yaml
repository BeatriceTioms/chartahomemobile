name: charta_home
description: "Charta Home — find, rent, pay for and look after your apartment."
publish_to: 'none'
version: 1.0.1+4

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  google_fonts: ^6.2.1
  intl: any
  image_picker: ^1.1.2
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  supabase_flutter: ^2.18.3
  url_launcher: ^6.3.2
  shared_preferences: ^2.5.5
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.2
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/photos/

